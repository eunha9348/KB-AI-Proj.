name: 실거래가 데이터 갱신

# 이 워크플로우는 GitHub 저장소 Secrets에 등록된 SEOUL_API_KEY만 사용합니다.
# 키는 GitHub의 암호화된 시크릿 저장소에만 존재하며, 로그에도 자동으로 마스킹되어
# 노출되지 않습니다. 로컬 컴퓨터·채팅·git 커밋 어디에도 실제 키가 남지 않습니다.

on:
  workflow_dispatch: {}   # GitHub 웹사이트의 "Run workflow" 버튼으로 수동 실행
  # schedule:
  #   - cron: "0 18 * * *"  # 필요하면 주석 해제: 매일 자동 갱신(UTC 18:00 = KST 03:00)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ETL (서울 열린데이터광장 실거래가 반영)
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python data/etl.py

      - name: DB → JSON 내보내기
        run: python data/export_json.py

      - name: 배포용 standalone.html 재빌드
        run: python data/build_standalone.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data.json frontend/standalone.html
          git diff --cached --quiet || git commit -m "chore: 실거래가 데이터 자동 갱신"
          git push
