name: 실거래가 데이터 갱신

# 이 워크플로우는 GitHub 저장소 Secrets(MOLIT_API_KEY / SEOUL_API_KEY)만 사용합니다.
# 키는 GitHub의 암호화된 시크릿 저장소에만 존재하며 로그에 자동 마스킹됩니다.
# MOLIT_API_KEY(국토부 data.go.kr)가 있으면 우선 사용(안정적), 없으면 SEOUL_API_KEY 사용.

on:
  workflow_dispatch: {}   # GitHub 웹사이트의 "Run workflow" 버튼으로 수동 실행
  # schedule:
  #   - cron: "0 18 * * *"  # 필요하면 주석 해제: 매일 자동 갱신(UTC 18:00 = KST 03:00)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ETL (국토부/서울 실거래가 반영)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python data/etl.py

      - name: 위험도 방법론 유효성 검증 (실데이터 기준 리포트 재생성)
        run: python data/validate_risk.py

      - name: DB → JSON 내보내기
        run: python data/export_json.py

      - name: 배포용 standalone.html 재빌드
        run: python data/build_standalone.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data.json frontend/standalone.html docs/risk_methodology_validation.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: 실거래가 데이터 자동 갱신"
          # 실행 도중(특히 오래된 실행을 Re-run했을 때) main이 앞서갈 수 있으므로,
          # push 직전에 최신 main 위로 rebase해 fast-forward 아님 오류를 방지한다.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
